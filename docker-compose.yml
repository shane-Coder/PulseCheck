services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsecheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsecheck}
      POSTGRES_DB: ${POSTGRES_DB:-pulsecheck}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsecheck}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

# No worker/beat container anymore — the periodic checks are plain function
# calls behind POST /internal/run-overdue-check and /internal/run-inactivity-check
# (see app/routers/internal.py), meant to be triggered by an external
# scheduler in production. Locally, trigger them by hand when you need to,
# e.g.:
#   curl -X POST localhost:8000/internal/run-overdue-check -H "X-Internal-Token: $INTERNAL_CRON_TOKEN"

volumes:
  postgres-data:
