# fly.toml app configuration file generated for pulsecheck-shivam on 2026-08-06T23:23:40+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pulsecheck-shivam'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[processes]
  web = 'uvicorn app.main:app --host 0.0.0.0 --port 8000'
  # No worker process anymore. The periodic checks that used to run inside
  # an always-on Celery worker (~$11/mo just to keep that machine up) are
  # now plain function calls behind /internal/run-*-check, triggered by a
  # GitHub Actions cron in this repo's .github/workflows/. The web machine
  # already auto-stops when idle (below), so most of the time nothing here
  # is running at all.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['web']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['web']
