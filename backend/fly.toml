# fly.toml app configuration file generated for pulsecheck-shivam on 2026-08-06T23:23:40+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pulsecheck-shivam'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[processes]
  web = 'uvicorn app.main:app --host 0.0.0.0 --port 8000'
  # --beat embeds the scheduler in the worker process instead of a separate
  # machine. Only safe with exactly one worker instance (which is all we
  # run) — multiple workers each with embedded beat would double-schedule
  # every task.
  # --without-gossip/--without-mingle/--without-heartbeat: these exist so
  # multiple workers can discover and coordinate with each other — pure
  # overhead (continuous Redis pub/sub chatter) with only one worker, which
  # is all we run. Confirmed via Redis INFO this instance was sustaining
  # ~6 ops/sec even fully idle before this change.
  worker = 'celery -A app.celery_app.celery_app worker --beat --loglevel=info --concurrency=2 --without-gossip --without-mingle --without-heartbeat'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['web']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['web']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['worker']
