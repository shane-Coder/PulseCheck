name: Run inactivity check

# Same replacement as run-overdue-check.yml, for the once-a-day inactivity
# sweep instead of the every-few-minutes overdue check. 03:00 UTC is just an
# arbitrary low-traffic hour — nothing about the check itself is time
# sensitive.

on:
  # Paused: the live demo is in maintenance mode (see app/maintenance.py),
  # so this would just hit a 503 once a day for nothing. Re-enable the
  # schedule line once maintenance mode is off and the DB is running again.
  # schedule:
  #   - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/run-inactivity-check
        run: |
          code=$(curl -s -o /tmp/response.json -w '%{http_code}' -X POST \
            https://pulsecheck-shivam.fly.dev/internal/run-inactivity-check \
            -H "X-Internal-Token: ${{ secrets.PULSECHECK_INTERNAL_TOKEN }}")
          echo "HTTP $code"
          cat /tmp/response.json
          echo ""
          if [ "$code" != "200" ]; then
            exit 1
          fi
