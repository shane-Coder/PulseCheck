name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt

      - name: Byte-compile check (catches syntax errors)
        working-directory: backend
        run: python -m py_compile $(find app -name "*.py")

      - name: Run tests
        working-directory: backend
        run: pytest

      - name: Build Docker image
        run: docker build -t pulsecheck-web ./backend
